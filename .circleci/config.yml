version: 2.1
jobs:
  build:
    docker:
      - image: cimg/ruby:3.4.12
    environment:
      - CC_TEST_REPORTER_ID: af1d9f6682174286b1e088c76e70d86f889270e130a678001ec2cd586ce9ce2f
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            gem install bundler --version 4.0.24
            bundle _4.0.24_ install
      - run:
          name: Rubocop
          command: bundle exec rubocop -D
      - run:
          name: Setup Code Climate test-reporter
          command: |
            mkdir -p tmp/
            curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 > ./tmp/cc-test-reporter
            chmod +x ./tmp/cc-test-reporter
      - run:
          name: Run tests
          command: |
            ./tmp/cc-test-reporter before-build
            bundle exec rspec
            ./tmp/cc-test-reporter after-build --coverage-input-type simplecov --exit-code $?
