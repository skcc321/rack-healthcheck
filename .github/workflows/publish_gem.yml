name: Publish gem

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish_gem:
    permissions:
      contents: write # create the release and its tag
      packages: write # push the gem to GitHub Packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: '3.4.13'
      - name: Get gem version
        shell: bash
        id: gem-meta
        run: |
          ruby -rrubygems -e 'spec = Gem::Specification.load("rack-healthcheck.gemspec") or abort "Cannot load gemspec"; puts "version=#{spec.version}"' >> "$GITHUB_OUTPUT"
      - name: Check version availability (package registry, git repository and GitHub release)
        shell: bash
        run: |
          has_value() {
            gh api --paginate "$1" | jq -ser --arg key "$2" --arg value "$3" '
              if length > 0 and all(.[]; type == "array" and all(.[]; type == "object" and (.[$key] | type == "string")))
              then any(.[][]; .[$key] == $value) | tostring
              else error("Unexpected paginated response") end'
          }
          owner_type=$(gh api "users/$GITHUB_REPOSITORY_OWNER" --jq .type)
          case "$owner_type" in
            User) scope="users" ;;
            Organization) scope="orgs" ;;
            *) echo "::error ::Unknown package namespace type"; exit 1 ;;
          esac
          packages="$scope/$GITHUB_REPOSITORY_OWNER/packages"
          exists=$(has_value "$packages?package_type=rubygems" name rack-healthcheck)
          if [[ "$exists" == true ]]; then
            exists=$(has_value "$packages/rubygems/rack-healthcheck/versions" name "$VERSION_NAME")
            if [[ "$exists" == true ]]; then
              echo "::error ::Package version already exists"
              exit 1
            fi
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/v$VERSION_NAME"; then
            echo "::error ::Git tag already exists"
            exit 1
          else
            [[ "$?" == 2 ]] || exit 1 # 2 means no matching refs
          fi
          exists=$(has_value "repos/$GITHUB_REPOSITORY/releases" tag_name "v$VERSION_NAME")
          if [[ "$exists" == true ]]; then
            echo "::error ::GitHub release already exists"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.gem-meta.outputs.version }}
      - name: Build gem
        run: gem build rack-healthcheck.gemspec --output "$RUNNER_TEMP/rack-healthcheck.gem"
      - name: Publish gem to GitHub Packages
        run: gem push "$RUNNER_TEMP/rack-healthcheck.gem" --host "$GEM_HOST"
        env:
          GEM_HOST: https://rubygems.pkg.github.com/${{ github.repository_owner }}
          GEM_HOST_API_KEY: Bearer ${{ github.token }}
      - name: Create GitHub release
        run: |
          args=(--target "$GITHUB_SHA" --generate-notes)
          if [[ "$GITHUB_REF_NAME" != master ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.gem-meta.outputs.version }}
